name: Auto Sync Development to Main

on:
  push:
    branches:
      - development

concurrency:
  group: sync-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-to-main:
    name: Sync Development to Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Development into Main and Push
        run: |
          echo "Fetching latest main and development branches..."
          git fetch origin main:main
          git checkout main

          echo "Merging development into main..."
          # Try fast-forward first; fallback to clean merge commit if histories diverged
          if ! git merge --ff-only development; then
            echo "Fast-forward not possible, performing merge commit..."
            git merge --no-edit -m "chore(release): sync development into main [skip ci]" development
          fi

          echo "Pushing updated main to origin..."
          git push origin main
          echo "Successfully synced development to main!"
